[project]
name = "aiops-platform"
version = "0.1.0"
description = "CICADA 2026 — Sentinel Edge AIOps Observability Platform"
requires-python = ">=3.11"

dependencies = [
    # Collector
    "psutil>=5.9",
    "python-dateutil>=2.9",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13",
    "python-dotenv>=1.0",
    "pyyaml>=6",
    # SaaS (Phase 2+)
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "respx>=0.21",        # mock httpx
    "pytest-asyncio>=0.23",
]

[project.scripts]
collector = "collector.cli:main"
aiopsctl = "saas.cli_aiopsctl:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.setuptools.packages.find]
where = ["."]
include = ["collector*", "saas*", "tools*"]
